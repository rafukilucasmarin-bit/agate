name: Build installers

# Genera:  Agate-Setup-<ver>.exe (Windows, NSIS)  y  Agate-Loader-<ver>.pkg (macOS)
# NOTA: este workflow NO se pudo ejecutar donde se escribió. Los pasos del mod están adaptados de la
# plantilla example-mod de Geode; si cambian sus inputs, ajústalos según esa plantilla.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s autoport/tests -v

  autoport:
    needs: tests
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: win, arch: "" }
          - { os: macos-14,       name: mac, arch: "--target-arch universal2" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name agate-autoport ${{ matrix.arch }} --paths autoport autoport/entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: autoport-${{ matrix.name }}
          path: dist/agate-autoport*

  mod:
    # Compilación del mod disparador, adaptada de la plantilla multi-plataforma de Geode.
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fijar la versión de Geode en mod.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # La versión oficial del loader/SDK es la última release de geode-sdk/geode en GitHub.
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/geode-sdk/geode/releases/latest \
                | python -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "Versión de Geode: $TAG"
          echo "GEODE_TAG=$TAG" >> "$GITHUB_ENV"
          # El script CMake de Geode compara el texto exacto: mod.json lleva "5.11.2", sin la "v".
          sed -i.bak "s/@GEODE_VERSION@/${TAG#v}/" mod.json && rm mod.json.bak
          cat mod.json
      - uses: geode-sdk/build-geode-mod@main
        with:
          sdk: ${{ env.GEODE_TAG }}
          combine: true

  package-mod:
    needs: mod
    runs-on: ubuntu-latest
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: ${{ steps.combine.outputs.build-output }}

  installer-windows:
    needs: [autoport, package-mod]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: autoport-win, path: art/autoport }
      - uses: actions/download-artifact@v4
        with: { name: mod, path: art/mod }
      - run: choco install nsis -y --no-progress
      - name: Descargar Geode oficial y validar su contenido
        run: python tools/fetch_geode.py --out build
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Lista de desinstalación
        run: python tools/gen_nsis_uninstall.py build/payload/win build/uninstall-list.nsh
      - name: Compilar el instalador
        shell: pwsh
        run: |
          $mod = (Get-ChildItem art/mod -Recurse -Filter "agate.autoport.geode" | Select-Object -First 1).FullName
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DVERSION=$env:VERSION" `
            "/DPAYLOAD_DIR=$PWD\build\payload\win" `
            "/DAUTOPORT_EXE=$PWD\art\autoport\agate-autoport.exe" `
            "/DAUTOPORT_MOD=$mod" `
            "/DUNINSTALL_LIST=$PWD\build\uninstall-list.nsh" `
            "/DOUTFILE=$PWD\Agate-Setup-$env:VERSION.exe" `
            installer/windows/agate.nsi
      - uses: actions/upload-artifact@v4
        with: { name: installer-windows, path: "Agate-Setup-*.exe" }

  installer-macos:
    needs: [autoport, package-mod]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: autoport-mac, path: art/autoport }
      - uses: actions/download-artifact@v4
        with: { name: mod, path: art/mod }
      - name: Descargar Geode oficial y validar su contenido
        run: python tools/fetch_geode.py --out build
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Diagnóstico de macOS (informativo, no bloquea)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "##### Dependencias y reexports de los dylib oficiales"
            for f in build/payload/mac/*.dylib; do
              echo "=== $f"; file "$f"; otool -L "$f"
              otool -l "$f" | grep -B1 -A4 -i "REEXPORT" || echo "(sin LC_REEXPORT_DYLIB)"
              echo "--- símbolos FMOD exportados:"; nm -gU "$f" 2>/dev/null | grep -ci fmod || true
            done
            echo; echo "##### Instalador oficial de Geode para macOS"
            python3 - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.github.com/repos/geode-sdk/geode/releases/latest",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json", "User-Agent": "agate-ci"})
          rel = json.load(urllib.request.urlopen(req))
          names = [a["name"] for a in rel["assets"]]
          print("assets:", names)
          pkgs = [a for a in rel["assets"] if a["name"].endswith(".pkg")]
          if pkgs:
              urllib.request.urlretrieve(pkgs[0]["browser_download_url"], "official.pkg")
              print("descargado:", pkgs[0]["name"])
          PY
            if [ -f official.pkg ]; then
              pkgutil --expand-full official.pkg official-expanded
              echo "--- ficheros:"; find official-expanded -type f | head -200
              find official-expanded -path '*Scripts*' -type f | while read -r f; do
                echo; echo "=== SCRIPT $f"; cat "$f"
              done
            fi
          } 2>&1 | tee diagnostico.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-macos
          path: diagnostico.txt
          if-no-files-found: ignore
      - name: Construir el .pkg
        env:
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}  # opcional (firma)
        run: |
          MOD=$(find art/mod -name 'agate.autoport.geode' | head -n1)
          chmod +x art/autoport/agate-autoport
          bash installer/macos/build-pkg.sh build/payload/mac art/autoport/agate-autoport "$MOD" \
            "${VERSION#v}" "Agate-Loader-${VERSION#v}.pkg"
      - uses: actions/upload-artifact@v4
        with: { name: installer-macos, path: "Agate-Loader-*.pkg" }

  release:
    if: github.ref_type == 'tag'
    needs: [installer-windows, installer-macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*" }
